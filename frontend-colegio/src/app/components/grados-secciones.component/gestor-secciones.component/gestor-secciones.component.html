<div class="card border-0 shadow-sm animate-fade-in">
    <div class="card-header bg-pizarra text-white py-3 border-0 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold"><i class="fas fa-users me-2 text-primary"></i>Gestión de Secciones</h5>
        <button class="btn btn-sm btn-outline-light fw-semibold" (click)="onVolver.emit()" *ngIf="!creandoNuevaSeccion">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </button>
    </div>
    
    <div class="card-body p-4">
        <div *ngIf="!creandoNuevaSeccion" class="animate-fade-in">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="alert alert-info mb-0 shadow-sm border-0 flex-grow-1 me-3">
                    <i class="fas fa-info-circle me-2"></i>Secciones registradas para: 
                    <strong>{{ gradoEnFoco?.nombreGrado }} <span *ngIf="gradoEnFoco?.nombreCarrera">({{ gradoEnFoco?.nombreCarrera }})</span></strong>
                </div>
                
                <button class="btn btn-primary fw-bold shadow-sm px-4 h-100" (click)="abrirCreacionSeccion()">
                    <i class="fas fa-plus me-2"></i>Agregar Sección
                </button>
            </div>

            <div class="table-responsive border rounded shadow-sm">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4 text-secondary" style="width: 15%;">ID</th>
                            <th class="text-secondary">SECCIÓN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngIf="secciones.length === 0">
                            <td colspan="3" class="text-center py-5 text-muted">
                                <i class="fas fa-folder-open fa-2x mb-3 d-block"></i>
                                Aún no existen secciones creadas para el ciclo activo.
                            </td>
                        </tr>
                        <tr *ngFor="let sec of secciones">
                            <td class="ps-4 fw-bold text-dark"># {{ sec.idSeccion }}</td>
                            <td class="fw-semibold text-primary">Sección {{ sec.nombre }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <app-crear-seccion 
            *ngIf="creandoNuevaSeccion"
            [gradoEnFoco]="gradoEnFoco"
            (onVolver)="cerrarCreacionSeccion(true)">
        </app-crear-seccion>

    </div>
</div>
