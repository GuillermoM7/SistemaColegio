<div class="card shadow-sm border-0 card-form">
    <div class="card-header header-oscuro py-3">
        <h5 class="mb-0 fw-bold"><i class="fas fa-user-shield me-2 text-esmeralda"></i>Registro de Personal</h5>
    </div>
    <div class="card-body p-4">
        <div *ngIf="mensajeError" class="alert alert-danger">{{ mensajeError }}</div>
        
        <form (ngSubmit)="guardar()">
            <div class="row">
                <div class="col-md-6 border-end pe-4">
                    <h6 class="section-title fw-bold">Datos de Acceso</h6>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo Electrónico *</label>
                        <input type="email" class="form-control" name="correo" [(ngModel)]="nuevoEmpleado.correo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contraseña Provisional *</label>
                        <input type="password" class="form-control" name="password" [(ngModel)]="nuevoEmpleado.password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nivel de Acceso (Rol) *</label>
                        <select class="form-select" name="idRol" [(ngModel)]="nuevoEmpleado.idRol" required>
                            <option [ngValue]="0" disabled selected>-- Seleccione un Rol --</option>
                            <option *ngFor="let rol of rolesPermitidos" [value]="rol.id">{{ rol.nombre }}</option>
                        </select>
                    </div>
                </div>

                <div class="col-md-6 ps-4">
                    <h6 class="section-title fw-bold">Información del Empleado</h6>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold">Nombres *</label>
                            <input type="text" class="form-control" name="nombres" [(ngModel)]="nuevoEmpleado.nombres" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Apellidos *</label>
                            <input type="text" class="form-control" name="apellidos" [(ngModel)]="nuevoEmpleado.apellidos" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Puesto / Cargo</label>
                        <input type="text" class="form-control" name="puesto" [(ngModel)]="nuevoEmpleado.puesto" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold">Fecha Contratación</label>
                            <input type="date" class="form-control" name="fechaContratacion" [(ngModel)]="nuevoEmpleado.fechaContratacion" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Salario Inicial (Q)</label>
                            <input type="number" min=0 class="form-control" name="salario" [(ngModel)]="nuevoEmpleado.salario" required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-end mt-4 pt-3 border-top">
                <button type="button" class="btn btn-light border me-2" (click)="onCancelar.emit()">Cancelar</button>
                <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Guardar Empleado</button>
            </div>
        </form>
    </div>
</div>
