<div class="container-fluid mt-4 animate-fade-in">
    <div *ngIf="!mostrarFormulario">
        <!-- Busqueda y boton -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-8">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0 text-primary">
                        <i class="fas fa-search"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 py-2 fw-bold text-secondary" 
                        placeholder="Buscar libro por título o autor..." 
                        [(ngModel)]="terminoBusqueda" (keyup)="filtrarLibros()">
                </div>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-esmeralda fw-bold shadow-sm w-100 py-2" (click)="abrirParaNuevo()">
                    <i class="fas fa-plus-circle me-2"></i>Registrar Nuevo Libro
                </button>
            </div>
        </div>

        <!-- Tabla de Inventario -->
        <div class="card card-tabla border-0 shadow-sm">
            <div class="table-responsive" *ngIf="!cargando">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-header-esmeralda">
                        <tr>
                            <th style="width: 35%">Título</th>
                            <th style="width: 25%">Autor</th>
                            <th style="width: 15%">Editorial</th>
                            <th class="text-center" style="width: 10%">Disponibilidad</th>
                            <th class="text-center" style="width: 15%">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngIf="librosFiltrados.length === 0">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="fas fa-book fa-2x mb-2 d-block"></i> No se encontraron libros.
                            </td>
                        </tr>
                        <tr *ngFor="let libro of librosPaginados">
                            <td class="fw-bold text-dark">{{ libro.titulo }}</td>
                            <td class="text-secondary fw-semibold">{{ libro.autor }}</td>
                            <td class="text-muted">{{ libro.editorial }}</td>
                            <td class="text-center">
                                <!-- Disponible total -->
                                <span class="badge" [ngClass]="libro.cantidadDisponible > 0 ? 'bg-success' : 'bg-danger'">
                                    {{ libro.cantidadDisponible }} / {{ libro.cantidadTotal }}
                                </span>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary me-2 shadow-sm" (click)="abrirParaEditar(libro)" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger shadow-sm" (click)="eliminarLibro(libro.idLibro)" title="Eliminar">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <app-paginacion 
                *ngIf="librosFiltrados.length > 0 && !cargando"
                [paginaActual]="paginaActual" 
                [totalPaginas]="totalPaginas" 
                [totalRegistros]="librosFiltrados.length"
                (cambioPagina)="onCambioPagina($event)">
            </app-paginacion>
        </div>
    </div>

    <!-- Crear/editar -->
    <app-formulario-libro 
        *ngIf="mostrarFormulario"
        [libroEditar]="libroEnEdicion"
        (onCerrar)="cerrarFormulario($event)">
    </app-formulario-libro>
</div>
