<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-success text-white">
      <h3 class="mb-0">Reporte Global de Ingresos</h3>
    </div>
    <div class="card-body p-4">
      
      <div class="alert alert-info mb-4">
        <i class="bi bi-info-circle-fill me-2"></i> 
        <strong>Nota:</strong> Si dejas las fechas en blanco, el reporte incluirá todo el historial de ingresos del sistema.
      </div>

      <div class="row mb-4">
        <div class="col-md-6">
          <label class="form-label fw-bold">Fecha de Inicio</label>
          <input type="date" class="form-control" [(ngModel)]="fechaInicio">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Fecha de Fin</label>
          <input type="date" class="form-control" [(ngModel)]="fechaFin">
        </div>
      </div>

      <div class="d-flex justify-content-end mt-2">
        <button class="btn btn-success px-4 py-2" (click)="generarPDF()" [disabled]="cargandoPDF">
          <span *ngIf="cargandoPDF" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ cargandoPDF ? 'Generando PDF...' : 'Generar Reporte' }}
        </button>
      </div>

    </div>
  </div>
</div>
