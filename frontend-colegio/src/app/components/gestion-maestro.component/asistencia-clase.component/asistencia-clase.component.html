<p>asistencia-clase.component works!</p>
<div class="animate-fade-in">
    <!-- Controles Superiores -->
    <div class="row align-items-center mb-4 bg-white p-3 rounded shadow-sm border">
        <div class="col-md-6">
            <h5 class="fw-bold text-secondary mb-0"><i class="fas fa-calendar-check me-2 text-primary"></i>Toma de Asistencia</h5>
        </div>
        <div class="col-md-6 d-flex justify-content-end align-items-center">
            <label class="fw-bold text-muted me-3 mb-0">Fecha:</label>
            <input type="date" class="form-control form-control-sm border-primary shadow-sm text-primary fw-bold" 
                style="width: 150px;" 
                [(ngModel)]="fechaAsistencia" 
                (change)="onFechaCambiada()">
        </div>
    </div>

    <!-- Alertas -->
    <div class="alert alert-success fw-bold animate-fade-in" *ngIf="mensajeExito">
        <i class="fas fa-check-circle me-2"></i>{{ mensajeExito }}
    </div>
    <div class="alert alert-danger fw-bold animate-fade-in" *ngIf="mensajeError">
        <i class="fas fa-exclamation-triangle me-2"></i>{{ mensajeError }}
    </div>

    <!-- Tabla Interactiva -->
    <div class="table-responsive bg-white rounded shadow-sm border mb-4">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-header-esmeralda">
                <tr>
                    <th class="text-center" style="width: 10%">No.</th>
                    <th style="width: 40%">Estudiante</th>
                    <th class="text-center" style="width: 50%">Estado (Marcar)</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of listaAsistencia; let i = index">
                    <td class="text-center fw-bold text-muted">{{ i + 1 }}</td>
                    <td>
                        <span class="fw-bold text-dark">{{ item.apellidos }}</span>, {{ item.nombres }}
                    </td>
                    <td class="text-center">
                        <!-- Botones de radio -->
                        <div class="btn-group shadow-sm" role="group">
                            <input type="radio" class="btn-check" [name]="'estado'+i" [id]="'presente'+i" value="Presente" [(ngModel)]="item.estado">
                            <label class="btn btn-outline-success btn-sm fw-bold px-3" [for]="'presente'+i">Presente</label>

                            <input type="radio" class="btn-check" [name]="'estado'+i" [id]="'ausente'+i" value="Ausente" [(ngModel)]="item.estado">
                            <label class="btn btn-outline-danger btn-sm fw-bold px-3" [for]="'ausente'+i">Ausente</label>

                            <input type="radio" class="btn-check" [name]="'estado'+i" [id]="'excusado'+i" value="Excusado" [(ngModel)]="item.estado">
                            <label class="btn btn-outline-warning btn-sm fw-bold px-3" [for]="'excusado'+i">Excusado</label>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Botón de Guardado -->
    <div class="text-end">
        <button class="btn btn-esmeralda btn-lg fw-bold shadow px-5" (click)="guardar()" [disabled]="guardando">
            <span *ngIf="!guardando"><i class="fas fa-save me-2"></i>Guardar Asistencia</span>
            <span *ngIf="guardando"><i class="fas fa-spinner fa-spin me-2"></i>Guardando...</span>
        </button>
    </div>
</div>
