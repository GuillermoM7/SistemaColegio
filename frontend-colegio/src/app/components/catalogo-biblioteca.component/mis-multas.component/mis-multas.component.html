<div class="card card-tabla border-0 animate-fade-in">
    <div class="card-header bg-pizarra text-white py-3 d-flex justify-content-between align-items-center">
        <span class="fw-bold"><i class="fas fa-file-invoice-dollar me-2 text-esmeralda"></i>Historial de Multas</span>
        <button class="btn btn-sm btn-outline-light" (click)="onVolver.emit()"><i class="fas fa-arrow-left me-1"></i>Volver al Catálogo</button>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-header-esmeralda">
                <tr>
                    <th>ID Multa</th>
                    <th>Libro Devuelto</th>
                    <th>Fecha de Devolución</th>
                    <th class="text-center">Monto</th>
                    <th class="text-center">Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngIf="multas.length === 0">
                    <td colspan="5" class="text-center py-5 text-success fw-bold"><i class="fas fa-medal me-2"></i>Historial limpio, sin multas.</td>
                </tr>
                <tr *ngFor="let m of multasPaginadas">
                    <td class="fw-bold text-muted">#{{ m.idMulta }}</td>
                    <td class="fw-bold text-dark">{{ m.tituloLibro }}</td>
                    <td>{{ m.fechaDevolucionReal }}</td>
                    <td class="text-center fw-bold text-danger">Q{{ m.monto | number:'1.2-2' }}</td>
                    <td class="text-center">
                        <span class="badge" [ngClass]="m.estado === 'PENDIENTE' ? 'bg-warning text-dark' : 'bg-esmeralda'">{{ m.estado }}</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <app-paginacion *ngIf="multas.length > 0" [paginaActual]="paginaActual" [totalPaginas]="totalPaginas" [totalRegistros]="multas.length" (cambioPagina)="paginaActual = $event"></app-paginacion>
</div>
