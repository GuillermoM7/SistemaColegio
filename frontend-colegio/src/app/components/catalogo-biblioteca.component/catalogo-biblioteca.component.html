<div class="container-fluid mt-4 animate-fade-in">
    <div *ngIf="vistaActiva === 'catalogo'">
        <!-- Barra de Búsqueda y Botones -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-7">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0 text-primary"><i class="fas fa-search"></i></span>
                    <input type="text" class="form-control border-start-0 py-2 fw-bold text-secondary" 
                        placeholder="Buscar en el catálogo por título o autor..." 
                        [(ngModel)]="terminoBusqueda" (keyup)="filtrarLibros()">
                </div>
            </div>
            <div class="col-md-5 text-end">
                <button class="btn btn-outline-primary fw-bold shadow-sm me-2" (click)="cambiarVista('pendientes')">
                    <i class="fas fa-book-reader me-2"></i>Mis Pendientes
                </button>
                <button class="btn btn-outline-danger fw-bold shadow-sm" (click)="cambiarVista('multas')">
                    <i class="fas fa-file-invoice-dollar me-2"></i>Mis Multas
                </button>
            </div>
        </div>

        <!-- Tabla del Catálogo -->
        <div class="card card-tabla border-0">
            <div class="card-header bg-pizarra text-white py-3 fw-bold">
                <i class="fas fa-list me-2 text-esmeralda"></i>Catálogo General de la Biblioteca
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-header-esmeralda">
                        <tr>
                            <th style="width: 40%">Título</th>
                            <th style="width: 30%">Autor</th>
                            <th style="width: 15%">Editorial</th>
                            <th class="text-center" style="width: 15%">Disponibilidad</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngIf="librosFiltrados.length === 0">
                            <td colspan="4" class="text-center py-4 text-muted">No se encontraron libros.</td>
                        </tr>
                        <tr *ngFor="let libro of librosPaginados">
                            <td class="fw-bold text-dark">{{ libro.titulo }}</td>
                            <td class="text-secondary">{{ libro.autor }}</td>
                            <td class="text-muted">{{ libro.editorial }}</td>
                            <td class="text-center">
                                <span class="badge" [ngClass]="libro.cantidadDisponible > 0 ? 'bg-esmeralda' : 'bg-secondary'">
                                    {{ libro.cantidadDisponible > 0 ? 'Disponible (' + libro.cantidadDisponible + ')' : 'Agotado' }}
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <app-paginacion 
                *ngIf="librosFiltrados.length > 0"
                [paginaActual]="paginaActual" 
                [totalPaginas]="totalPaginas" 
                [totalRegistros]="librosFiltrados.length"
                (cambioPagina)="onCambioPagina($event)">
            </app-paginacion>
        </div>
    </div>

    <app-mis-prestamos *ngIf="vistaActiva === 'pendientes'" 
                    [idUsuario]="idUsuarioActual" 
                    (onVolver)="cambiarVista('catalogo')">
    </app-mis-prestamos>

    <app-mis-multas *ngIf="vistaActiva === 'multas'" 
                    [idUsuario]="idUsuarioActual" 
                    (onVolver)="cambiarVista('catalogo')">
    </app-mis-multas>
</div>
