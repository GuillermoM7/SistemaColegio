<div class="card card-tabla border-0 animate-fade-in">
    <div class="card-header bg-pizarra text-white py-3 d-flex justify-content-between align-items-center">
        <span class="fw-bold"><i class="fas fa-book-reader me-2 text-esmeralda"></i>Mis Libros Pendientes de Devolver</span>
        <button class="btn btn-sm btn-outline-light" (click)="onVolver.emit()"><i class="fas fa-arrow-left me-1"></i>Volver al Catálogo</button>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-header-esmeralda">
                <tr>
                    <th>Libro</th>
                    <th>Fecha Préstamo</th>
                    <th>Fecha Límite</th>
                    <th class="text-center">Estado (Mora)</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngIf="prestamos.length === 0">
                    <td colspan="4" class="text-center py-5 text-success fw-bold"><i class="fas fa-check-circle me-2"></i>No tienes libros pendientes.</td>
                </tr>
                <tr *ngFor="let p of prestamosPaginados">
                    <td class="fw-bold text-dark">{{ p.tituloLibro }}</td>
                    <td>{{ p.fechaPrestamo }}</td>
                    <td class="fw-bold text-primary">{{ p.fechaEsperada }}</td>
                    <td class="text-center">
                        <span class="badge" [ngClass]="p.diasAtraso > 0 ? 'bg-danger' : 'bg-esmeralda'">
                            <span *ngIf="p.diasAtraso === 0">Al día</span>
                            <span *ngIf="p.diasAtraso > 0">Atrasado {{ p.diasAtraso }} días (Q{{ p.montoMulta }})</span>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <app-paginacion *ngIf="prestamos.length > 0" [paginaActual]="paginaActual" [totalPaginas]="totalPaginas" [totalRegistros]="prestamos.length" (cambioPagina)="paginaActual = $event"></app-paginacion>
</div>
