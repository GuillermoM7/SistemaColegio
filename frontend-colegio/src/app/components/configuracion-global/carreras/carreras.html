<div class="card border-0 shadow-sm mt-3">
    <div class="card-body p-4">
        
        <div class="card bg-light border-0 mb-4">
            <div class="card-body">
                <form (ngSubmit)="guardarCarrera()" class="row gx-3 align-items-center">
                    <div class="col-md-9">
                        <label class="visually-hidden">Nombre de la Carrera</label>
                        <input type="text" class="form-control" placeholder="Ej. Perito Contador con Orientación en Computación" 
                            name="nombreCarrera" [(ngModel)]="nuevaCarrera.nombre" required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100 fw-bold" [disabled]="!nuevaCarrera.nombre">
                            <i class="fas fa-save me-2"></i>Crear Carrera
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Alertas -->
        <div *ngIf="mensajeExito" class="alert alert-success alert-dismissible fade show py-2" role="alert">
            <i class="fas fa-check-circle me-2"></i>{{ mensajeExito }}
            <button type="button" class="btn-close py-2" (click)="mensajeExito = ''"></button>
        </div>
        <div *ngIf="mensajeError" class="alert alert-danger alert-dismissible fade show py-2" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>{{ mensajeError }}
            <button type="button" class="btn-close py-2" (click)="mensajeError = ''"></button>
        </div>

        <!-- Tabla de Carreras -->
        <div class="table-responsive">
            <table class="table table-hover align-middle border">
                <thead class="table-light text-secondary">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>NOMBRE DE LA CARRERA</th>
                        <th class="text-center">ESTADO</th>
                        <th class="text-center pe-4">ACCIÓN</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngIf="listaCarreras.length === 0">
                        <td colspan="4" class="text-center py-4 text-muted">
                            <i class="fas fa-info-circle me-2"></i>No hay carreras registradas en el sistema.
                        </td>
                    </tr>
                    <tr *ngFor="let carrera of listaCarreras">
                        <td class="ps-4 fw-bold text-dark"># {{ carrera.idCarrera }}</td>
                        <td>{{ carrera.nombre }}</td>
                        <td class="text-center">
                            <span class="badge rounded-pill" [ngClass]="carrera.activa ? 'bg-success' : 'bg-secondary'">
                                {{ carrera.activa ? 'ACTIVA' : 'INACTIVA' }}
                            </span>
                        </td>
                        <td class="text-center pe-4">
                            <!-- boton de cambio -->
                            <button class="btn btn-sm fw-bold"
                                    [ngClass]="carrera.activa ? 'btn-outline-danger' : 'btn-outline-success'"
                                    (click)="cambiarEstado(carrera)">
                                <i class="fas" [ngClass]="carrera.activa ? 'fa-ban' : 'fa-check'"></i>
                                {{ carrera.activa ? 'Desactivar' : 'Reactivar' }}
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
</div>
