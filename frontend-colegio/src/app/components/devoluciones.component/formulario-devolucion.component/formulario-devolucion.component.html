<div class="card border-0 shadow-sm animate-fade-in max-w-75 mx-auto mt-4">
    <div class="card-header bg-pizarra text-white fw-bold py-3 d-flex justify-content-between align-items-center">
        <span><i class="fas fa-undo-alt me-2 text-esmeralda"></i>Recibir Devolución</span>
        <button class="btn btn-sm btn-outline-light" (click)="onCerrar.emit(false)">Cancelar</button>
    </div>
    
    <div class="card-body p-4 bg-light text-center">
        <h4 class="fw-bold text-dark mb-4">{{ prestamo.tituloLibro }}</h4>
        
        <div class="row justify-content-center mb-4">
            <div class="col-md-5">
                <div class="p-3 border rounded bg-white">
                    <small class="text-muted d-block fw-bold mb-1">Fecha Préstamo</small>
                    <span class="fs-5 fw-bold text-secondary">{{ prestamo.fechaPrestamo }}</span>
                </div>
            </div>
            <div class="col-md-5">
                <div class="p-3 border rounded bg-white">
                    <small class="text-muted d-block fw-bold mb-1">Fecha Esperada</small>
                    <span class="fs-5 fw-bold text-danger">{{ prestamo.fechaEsperada }}</span>
                </div>
            </div>
        </div>

        <div class="alert mb-4" [ngClass]="prestamo.diasAtraso > 0 ? 'alert-danger' : 'alert-success'">
            <div class="row">
                <div class="col-6 border-end">
                    <span class="d-block fw-bold text-uppercase small">Días de Atraso</span>
                    <span class="fs-3 fw-bold">{{ prestamo.diasAtraso }}</span>
                </div>
                <div class="col-6">
                    <span class="d-block fw-bold text-uppercase small">Suma de Mora Generada</span>
                    <span class="fs-3 fw-bold">Q{{ prestamo.montoMulta | number:'1.2-2' }}</span>
                </div>
            </div>
        </div>

        <button class="btn btn-esmeralda btn-lg px-5 fw-bold shadow-sm" (click)="recogerLibro()" [disabled]="guardando">
            <span *ngIf="!guardando"><i class="fas fa-check-circle me-2"></i>Recoger Libro y Cerrar Préstamo</span>
            <span *ngIf="guardando"><i class="fas fa-spinner fa-spin me-2"></i>Procesando Transacción...</span>
        </button>
    </div>
</div>
