<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
        <h3 class="mb-0">Historial de Pagos por Estudiante</h3>
        </div>
    <div class="card-body">
    
        <!-- Sección de Búsqueda de Estudiante -->
    <div *ngIf="!estudianteSeleccionado" class="mb-4">
    <label class="form-label fw-bold">Buscar Estudiante</label>
        <div class="input-group mb-2">
        <input type="text" class="form-control" placeholder="Ingrese nombre o apellidos..." [(ngModel)]="terminoBusqueda" (keyup.enter)="buscarEstudiante()">
        <button class="btn btn-outline-secondary" (click)="buscarEstudiante()">Buscar</button>
        </div>
        
        <!-- Lista de Resultados -->
        <ul class="list-group" *ngIf="resultadosBusqueda.length > 0">
        <li class="list-group-item list-group-item-action d-flex justify-content-between align-items-center cursor-pointer" 
              *ngFor="let est of resultadosBusqueda" (click)="seleccionarEstudiante(est)">
            {{ est.nombres }} {{ est.apellidos }}
            <span class="badge bg-primary rounded-pill">Seleccionar</span>
        </li>
    </ul>
    </div>

    <!-- Sección del Estudiante Seleccionado y Fechas -->
    <div *ngIf="estudianteSeleccionado" class="p-3 mb-4 bg-light border rounded">
        <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 text-primary">
            <i class="bi bi-person-circle me-2"></i>
            {{ estudianteSeleccionado.nombres }} {{ estudianteSeleccionado.apellidos }}
        </h5>
        <button class="btn btn-sm btn-outline-danger" (click)="deseleccionarEstudiante()">Cambiar Alumno</button>
        </div>

        <div class="row">
        <div class="col-md-6">
            <label class="form-label fw-bold">Fecha de Inicio</label>
            <input type="date" class="form-control" [(ngModel)]="fechaInicio">
        </div>
            <div class="col-md-6">
            <label class="form-label fw-bold">Fecha de Fin</label>
            <input type="date" class="form-control" [(ngModel)]="fechaFin">
        </div>
        </div>
    </div>

    <!-- Botón de Generación -->
    <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-success px-4 py-2" (click)="generarPDF()" [disabled]="!formularioValido || cargandoPDF">
          <span *ngIf="cargandoPDF" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ cargandoPDF ? 'Generando PDF...' : 'Generar Estado de Cuenta' }}
        </button>
    </div>

    </div>
    </div>
</div>
