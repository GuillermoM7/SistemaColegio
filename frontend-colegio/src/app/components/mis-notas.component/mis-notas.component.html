<div class="container-fluid mt-4">
    <div class="text-center py-5 mt-5" *ngIf="cargando && !errorAutenticacion">
        <i class="fas fa-spinner fa-spin fa-3x text-esmeralda mb-3"></i>
        <h5 class="text-muted fw-bold">Consultando base de datos académica...</h5>
    </div>

    <div class="alert alert-danger shadow-sm border-0 animate-fade-in" *ngIf="errorAutenticacion">
        <i class="fas fa-exclamation-triangle me-2"></i> Error al cargar tu perfil. Contacta a secretaría.
    </div>

    <div class="animate-fade-in" *ngIf="!cargando && datosMiPerfil">

        <app-expediente-alumno 
            [estudiante]="datosMiPerfil" 
            [esVistaEstudiante]="true">
        </app-expediente-alumno>
    </div>
</div>
