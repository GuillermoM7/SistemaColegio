<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">
            <i class="fas fa-user-circle text-primary"></i> Iniciar Sesión
          </h3>
          
          <form (ngSubmit)="ejecutarLogin()">          
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" class="form-control" name="usuario" [(ngModel)]="username" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" class="form-control" name="clave" [(ngModel)]="password" required>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary">
                Entrar <i class="bi bi-box-arrow-in-right ms-2"></i>
              </button>
            </div>
            
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
