<div class="login-wrapper">
    <div class="login-card animate-fade-in">
        <div class="login-header">
            <div class="logo-circle">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h2>Portal Educativo</h2>
            <p *ngIf="vistaActiva === 0">Ingresa tus credenciales para continuar</p>
            <p *ngIf="vistaActiva === 1">Recuperación de cuenta</p>
            <p *ngIf="vistaActiva === 2">Crea tu nueva contraseña</p>
        </div>

        <div class="login-body">
            <!-- Mensajes -->
            <div class="alert alert-error" *ngIf="mensajeError"><i class="fas fa-exclamation-circle"></i> {{ mensajeError }}</div>
            <div class="alert alert-success" *ngIf="mensajeExito"><i class="fas fa-check-circle"></i> {{ mensajeExito }}</div>

            <!-- Vista login -->
            <form (ngSubmit)="ejecutarLogin()" *ngIf="vistaActiva === 0">
                <div class="input-group">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" name="correo" [(ngModel)]="correo" placeholder="Correo Electrónico" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" name="password" [(ngModel)]="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-primary" [disabled]="procesando">
                    <span *ngIf="!procesando">Iniciar Sesión</span>
                    <i *ngIf="procesando" class="fas fa-spinner fa-spin"></i>
                </button>
                <a href="javascript:void(0)" class="link-action text-center d-block mt-3" (click)="cambiarVista(1)">¿Olvidaste tu contraseña?</a>
            </form>

            <!-- vista confirar correo -->
            <form (ngSubmit)="verificarCorreo()" *ngIf="vistaActiva === 1">
                <div class="input-group">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" name="correoRecuperacion" [(ngModel)]="correoRecuperacion" placeholder="Tu correo registrado" required>
                </div>
                <button type="submit" class="btn-primary" [disabled]="procesando">
                    <span *ngIf="!procesando">Verificar Correo</span>
                    <i *ngIf="procesando" class="fas fa-spinner fa-spin"></i>
                </button>
                <a href="javascript:void(0)" class="link-action text-center d-block mt-3" (click)="cambiarVista(0)">Volver al Login</a>
            </form>

            <!-- vista cambio-->
            <form (ngSubmit)="guardarNuevaPassword()" *ngIf="vistaActiva === 2">
                <div class="input-group">
                    <i class="fas fa-key icon"></i>
                    <input type="password" name="nuevaPassword" [(ngModel)]="nuevaPassword" placeholder="Nueva Contraseña" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-check-double icon"></i>
                    <input type="password" name="confirmarPassword" [(ngModel)]="confirmarPassword" placeholder="Confirmar Contraseña" required>
                </div>
                <button type="submit" class="btn-primary" [disabled]="procesando">
                    <span *ngIf="!procesando">Actualizar Contraseña</span>
                    <i *ngIf="procesando" class="fas fa-spinner fa-spin"></i>
                </button>
                <a href="javascript:void(0)" class="link-action text-center d-block mt-3" (click)="cambiarVista(0)">Cancelar</a>
            </form>
        </div>
    </div>
</div>
