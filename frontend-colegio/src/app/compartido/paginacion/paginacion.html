<div class="card-footer bg-white py-3 d-flex justify-content-between align-items-center border-top-0">
    <span class="text-muted small fw-semibold">Total de registros: {{ totalRegistros }}</span>

    <nav aria-label="Navegación de páginas">
    <ul class="pagination pagination-sm mb-0 shadow-sm">

    <li class="page-item" [class.disabled]="paginaActual <= 1">
        <a class="page-link text-secondary" style="cursor: pointer;" (click)="cambiarPagina(paginaActual - 1)">
            <i class="fas fa-chevron-left me-1"></i> Anterior
        </a>
    </li>

    <li class="page-item active" *ngIf="totalPaginas > 0">
        <a class="page-link bg-esmeralda border-esmeralda fw-bold">
            {{ paginaActual }} de {{ totalPaginas }}
        </a>
    </li>
    
    <li class="page-item" [class.disabled]="paginaActual >= totalPaginas">
        <a class="page-link text-secondary" style="cursor: pointer;" (click)="cambiarPagina(paginaActual + 1)">
        Siguiente <i class="fas fa-chevron-right ms-1"></i>
        </a>
    </li>
    
    </ul>
    </nav>
</div>
